name: Signal Backtest Pipeline

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1️⃣ リポジトリ取得
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v3

      # =========================
      # 2️⃣ Python環境
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # =========================
      # 3️⃣ キャッシュ復元
      # =========================
      - name: Restore Price Cache
        uses: actions/cache@v3
        with:
          path: stock_data/prices.parquet
          key: price-cache-v1
          restore-keys: |
            price-cache-

      # =========================
      # 4️⃣ 依存関係
      # =========================
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_ai.txt

      # =========================
      # 5️⃣ データ取得
      # =========================
      - name: Download Prices
        run: |
          python download_prices.py

      # =========================
      # 6️⃣ 特徴量生成
      # =========================
      - name: Feature Engineering
        run: |
          python feature_engineering.py

      # =========================
      # 7️⃣ forward return生成（最重要）
      # =========================
      - name: Create Dataset (Forward Returns)
        run: |
          python create_ml_dataset.py

      # =========================
      # 8️⃣ シグナル生成
      # =========================
      - name: Generate Signals
        run: |
          python signal_engine.py

      # =========================
      # 9️⃣ バックテスト（ML削除）
      # =========================
      - name: Run Backtest
        run: |
          python backtest.py

      # =========================
      # 10️⃣ 出力確認
      # =========================
      - name: Check Outputs
        run: |

          echo "===== STOCK DATA ====="
          ls -lh stock_data/

          echo ""
          echo "===== SIGNALS ====="
          ls -lh stock_data/signals.parquet || echo "No signals file"

          echo ""
          echo "===== EQUITY CURVE ====="
          head stock_data/equity_curve.csv || echo "No equity curve"

      # =========================
      # 11️⃣ キャッシュ保存
      # =========================
      - name: Save Price Cache
        uses: actions/cache@v3
        with:
          path: stock_data/prices.parquet
          key: price-cache-v1

      # =========================
      # 12️⃣ 結果コミット
      # =========================
      - name: Commit Results
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add stock_data/signals.parquet || true
          git add stock_data/equity_curve.csv || true
          git add stock_data/ml_dataset.parquet || true

          git commit -m "update signal pipeline results [skip ci]" || echo "No changes"

          git push origin HEAD:main