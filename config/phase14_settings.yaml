# Phase 14 long_oversold_rebound Conditional Edge Independent Validation
# parameters.
#
# These are diagnostic-analysis settings only - they do not affect
# Signal/Score/Backtest/WFO behavior in any way, and are deliberately
# kept OUT of config/settings.yaml so config_hash (computed from
# settings.yaml + universe_filters.yaml only) continues to prove
# "Signal/Score/Backtest/WFO unchanged since Phase 6.5/7".
#
# PRE-REGISTERED (spec section 2/3/28): every value below is fixed and
# saved to data/walk_forward/phase14_preregistration.json BEFORE any
# real analysis runs against Full Universe data, and must NEVER be
# edited after seeing results - not even to "improve" a borderline
# finding. This is Phase 14's own version of Phase 9/11's
# "事前固定" convention, made stricter per spec section 3's explicit
# pre-registration requirement.

topix_20d_threshold_grid: [-0.05, -0.075, -0.10, -0.125, -0.15]

major_episode_min_trades: 5

ticker_cluster_bootstrap:
  n_resamples: 10000
  seed: 46
  confidence_level: 0.95

timing_placebo:
  offsets: [-15, -10, -7, -5, -3, -2, -1, 0, 1, 2, 3, 5, 7, 10]
