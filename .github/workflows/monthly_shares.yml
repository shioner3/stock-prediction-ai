name: Monthly Shares Outstanding Update

on:
  workflow_dispatch:

  schedule:
    # 毎月1日 09:00 JST
    # GitHub ActionsはUTCなので 00:00 UTC = 09:00 JST
    - cron: '0 0 1 * *'

jobs:
  shares:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =========================
      # Restore Cache
      # =========================
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: stock_data/shares_outstanding.parquet
          key: shares-cache-v1
          restore-keys: |
            shares-cache-

      # =========================
      # Install Dependencies
      # =========================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Update Shares Outstanding
      # =========================
      - name: Update Shares Outstanding
        run: |
          python update_shares_outstanding.py

      # =========================
      # Check Output
      # =========================
      - name: Check Output
        run: |

          echo "===== SHARES FILE ====="

          ls -lh stock_data/

          echo ""
          echo "===== PREVIEW ====="

          python - << 'EOF'
          import pandas as pd

          df = pd.read_parquet(
              "stock_data/shares_outstanding.parquet"
          )

          print(df.head())
          print()
          print("Rows:", len(df))
          EOF

      # =========================
      # Save Cache
      # =========================
      - name: Save Cache
        uses: actions/cache@v4
        with:
          path: stock_data/shares_outstanding.parquet
          key: shares-cache-v1

      # =========================
      # Commit Results
      # =========================
      - name: Commit Results
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add stock_data/shares_outstanding.parquet

          git commit -m "monthly shares outstanding update [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main