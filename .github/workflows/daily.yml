name: Daily Accumulation Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: '0 14 * * 1-5'

jobs:
  accumulation:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =========================
      # Cache Restore
      # =========================
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            stock_data/prices.parquet
            stock_data/shares_outstanding.parquet
          key: accumulation-cache-v1
          restore-keys: |
            accumulation-cache-

      # =========================
      # Install Dependencies
      # =========================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Download Prices
      # =========================
      - name: Download Prices
        run: |
          python download_prices.py

      # =========================
      # Calculate Accumulation Score
      # =========================
      - name: Calculate Accumulation Score
        run: |
          python calculate_accumulation_score.py

      # =========================
      # Run Backtest
      # =========================
      - name: Run Backtest
        run: |
          python backtest_accumulation.py

      # =========================
      # Output Check
      # =========================
      - name: Check Outputs
        run: |

          echo "===== STOCK DATA ====="
          ls -lh stock_data/

          echo ""
          echo "===== RANKING ====="

          if [ -f stock_data/accumulation_ranking.csv ]; then
            head -20 stock_data/accumulation_ranking.csv
          fi

          echo ""
          echo "===== BACKTEST ====="

          if [ -f stock_data/backtest_result.csv ]; then
            head -20 stock_data/backtest_result.csv
          fi

      # =========================
      # Commit Results
      # =========================
      - name: Commit Results
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add stock_data/accumulation_score.parquet || true
          git add stock_data/accumulation_ranking.csv || true
          git add stock_data/backtest_result.csv || true

          git commit -m "daily accumulation update [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main